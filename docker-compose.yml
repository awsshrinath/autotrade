services:
  # Main Trading Runner - Combined multi-asset trading bot
  main-runner:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RUNNER_SCRIPT: runner/main_runner.py
    container_name: tron-main-runner
    env_file:
      - .env.docker
    environment:
      - RUNNER_SCRIPT=runner/main_runner.py
      - SERVICE_PORT=8080
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./gpt-runner-sa-key.json:/app/gpt-runner-sa-key.json:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "/app/docker-healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - tron-network

  # Stock Trading Bot
  stock-trader:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RUNNER_SCRIPT: stock_trading/stock_runner.py
    container_name: tron-stock-trader
    env_file:
      - .env.docker
    environment:
      - RUNNER_SCRIPT=stock_trading/stock_runner.py
      - SERVICE_PORT=8081
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./gpt-runner-sa-key.json:/app/gpt-runner-sa-key.json:ro
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "/app/docker-healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - tron-network

  # Options Trading Bot
  options-trader:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RUNNER_SCRIPT: options_trading/options_runner.py
    container_name: tron-options-trader
    env_file:
      - .env.docker
    environment:
      - RUNNER_SCRIPT=options_trading/options_runner.py
      - SERVICE_PORT=8082
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./gpt-runner-sa-key.json:/app/gpt-runner-sa-key.json:ro
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "/app/docker-healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - tron-network

  # Futures Trading Bot
  futures-trader:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RUNNER_SCRIPT: futures_trading/futures_runner.py
    container_name: tron-futures-trader
    env_file:
      - .env.docker
    environment:
      - RUNNER_SCRIPT=futures_trading/futures_runner.py
      - SERVICE_PORT=8083
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./gpt-runner-sa-key.json:/app/gpt-runner-sa-key.json:ro
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD", "/app/docker-healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - tron-network

  # Dashboard API Backend
  dashboard-api:
    build:
      context: .
      dockerfile: ./dashboard_api/Dockerfile
    container_name: tron-dashboard-api
    env_file:
      - .env.docker
    environment:
      - API_PORT=8090
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./gpt-runner-sa-key.json:/app/gpt-runner-sa-key.json:ro
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - tron-network

  # Frontend Dashboard
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tron-frontend
    env_file:
      - .env.docker
    environment:
      - PORT=3000
    ports:
      - "3000:3000"
    depends_on:
      - dashboard-api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - tron-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: tron-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - frontend
      - dashboard-api
      - main-runner
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - tron-network

  # Log Aggregator Service (Optional)
  log-aggregator:
    build:
      context: .
      dockerfile: ./gpt_runner/log_aggregator/Dockerfile
    container_name: tron-log-aggregator
    env_file:
      - .env.docker
    environment:
      - LOG_AGGREGATOR_PORT=8095
    volumes:
      - ./logs:/app/logs
      - ./gpt-runner-sa-key.json:/app/gpt-runner-sa-key.json:ro
    ports:
      - "8095:8095"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8095/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - tron-network

volumes:
  logs:
    driver: local
  data:
    driver: local

networks:
  tron-network:
    driver: bridge
    name: tron-network