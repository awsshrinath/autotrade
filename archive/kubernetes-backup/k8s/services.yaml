apiVersion: v1
kind: Service
metadata:
  name: dashboard-api
  namespace: gpt
  labels:
    app: dashboard-api
spec:
  selector:
    app: dashboard-api
  ports:
  - protocol: TCP
    port: 8001
    targetPort: 8001
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: gpt
  labels:
    app: frontend
spec:
  selector:
    app: frontend
  ports:
  - protocol: TCP
    port: 3000
    targetPort: 3000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-proxy
  namespace: gpt
  labels:
    app: nginx-proxy
spec:
  selector:
    app: nginx-proxy
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  type: LoadBalancer