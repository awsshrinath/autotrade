apiVersion: batch/v1
kind: CronJob
metadata:
  name: fixed-post-market-scaler
  namespace: gpt
  labels:
    app: trading-scaler
    purpose: post-market-shutdown
spec:
  schedule: "30 16 * * 1-5" # 4:30 PM IST, Mon-Fri
  timeZone: "Asia/Kolkata"
  jobTemplate:
    spec:
      activeDeadlineSeconds: 300  # Kill job after 5 minutes
      backoffLimit: 2  # Retry twice if it fails
      template:
        spec:
          serviceAccountName: cronjob-scaler
          restartPolicy: Never  # Don't restart on failure
          containers:
          - name: kubectl-scaler
            image: bitnami/kubectl:latest
            resources:
              requests:
                cpu: "50m"
                memory: "64Mi"
              limits:
                cpu: "100m"
                memory: "128Mi"
            env:
            - name: NAMESPACE
              value: "gpt"
            command:
            - "/bin/sh"
            - "-c"
            - |
              set -euo pipefail  # Exit on any error
              
              echo "🕐 Starting post-market scaling at $(date)"
              echo "Namespace: $NAMESPACE"
              
              # List of all deployments to scale down
              DEPLOYMENTS=(
                "stock-trader"
                "options-trader"
                "futures-trader"
                "main-runner"
                "cognitive-system"
                "frontend"
                "tron-backend"
                "monitoring-service"
                "nginx-proxy"
              )
              
              # Function to scale with error handling
              scale_deployment() {
                local deployment=$1
                echo "📉 Scaling $deployment to 0 replicas..."
                
                if kubectl scale deployment "$deployment" -n "$NAMESPACE" --replicas=0 --timeout=30s; then
                  echo "✅ Successfully scaled $deployment"
                  return 0
                else
                  echo "❌ Failed to scale $deployment"
                  return 1
                fi
              }
              
              # Scale down all deployments
              SUCCESS_COUNT=0
              TOTAL_COUNT=${#DEPLOYMENTS[@]}
              
              for deployment in "${DEPLOYMENTS[@]}"; do
                if scale_deployment "$deployment"; then
                  ((SUCCESS_COUNT++))
                fi
              done
              
              echo ""
              echo "📊 SCALING SUMMARY:"
              echo "  - Total deployments: $TOTAL_COUNT"
              echo "  - Successfully scaled: $SUCCESS_COUNT"
              echo "  - Failed: $((TOTAL_COUNT - SUCCESS_COUNT))"
              
              # Verify final state
              echo ""
              echo "📋 Final deployment status:"
              kubectl get deployments -n "$NAMESPACE" -o custom-columns="NAME:.metadata.name,REPLICAS:.spec.replicas,READY:.status.readyReplicas"
              
              if [ $SUCCESS_COUNT -eq $TOTAL_COUNT ]; then
                echo "🎯 Post-market scaling completed successfully!"
                exit 0
              else
                echo "⚠️  Some deployments failed to scale. Check logs above."
                exit 1
              fi
  concurrencyPolicy: Forbid  # Don't run multiple instances
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 2 