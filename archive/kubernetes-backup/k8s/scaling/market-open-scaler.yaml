apiVersion: batch/v1
kind: CronJob
metadata:
  name: pre-market-scaler
  namespace: gpt
spec:
  schedule: "15 8 * * 1-5" # 8:15 AM IST, Monday to Friday
  timeZone: "Asia/Kolkata"
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: cronjob-scaler
          containers:
          - name: kubectl-scaler
            image: bitnami/kubectl:latest
            resources:
              requests:
                cpu: "50m"
                memory: "64Mi"
              limits:
                cpu: "100m"
                memory: "128Mi"
            command:
            - "/bin/sh"
            - "-c"
            - |
              echo "Scaling up support services for pre-market..."
              kubectl scale deployment nginx-proxy --replicas=1
              kubectl scale deployment tron-backend --replicas=1
              kubectl scale deployment main-runner --replicas=1
              kubectl scale deployment frontend --replicas=1
              kubectl scale deployment monitoring-service --replicas=1
              kubectl scale deployment cognitive-system --replicas=1
              echo "Pre-market scaling complete."
          restartPolicy: OnFailure
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1 