name: Deploy Tron System to GKE

on:
  push:
    branches:
      - main
  repository_dispatch:
    types: [cluster_ready]
  workflow_dispatch:
    inputs:
      cluster_ready:
        description: 'Deploy after cluster is ready'
        required: false
        default: 'true'

jobs:
  build-and-push-images:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Authenticate to Google Cloud
      uses: 'google-github-actions/auth@v1'
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: Set up Cloud SDK
      uses: 'google-github-actions/setup-gcloud@v1'

    - name: Configure Docker
      run: gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

    - name: Build and Push All Images
      run: |
        TAG=${{ github.sha }}
        IMAGE_PREFIX="asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/tron-system"

        docker build -f dashboard_api/Dockerfile -t $IMAGE_PREFIX/tron-backend:$TAG -t $IMAGE_PREFIX/tron-backend:latest .
        docker push --all-tags $IMAGE_PREFIX/tron-backend

        docker build -f frontend/Dockerfile -t $IMAGE_PREFIX/tron-frontend:$TAG -t $IMAGE_PREFIX/tron-frontend:latest ./frontend
        docker push --all-tags $IMAGE_PREFIX/tron-frontend

        docker build -f gpt_runner/log_aggregator/Dockerfile -t $IMAGE_PREFIX/log-aggregator:$TAG -t $IMAGE_PREFIX/log-aggregator:latest .
        docker push --all-tags $IMAGE_PREFIX/log-aggregator
        
        docker build -t $IMAGE_PREFIX/gpt-runner:$TAG -t $IMAGE_PREFIX/gpt-runner:latest --build-arg RUNNER_SCRIPT=runner/main_runner.py .
        docker push --all-tags $IMAGE_PREFIX/gpt-runner
        
        docker build -t $IMAGE_PREFIX/stock-trader:$TAG -t $IMAGE_PREFIX/stock-trader:latest --build-arg RUNNER_SCRIPT=stock_trading/stock_runner.py .
        docker push --all-tags $IMAGE_PREFIX/stock-trader

        docker build -t $IMAGE_PREFIX/options-trader:$TAG -t $IMAGE_PREFIX/options-trader:latest --build-arg RUNNER_SCRIPT=options_trading/options_runner.py .
        docker push --all-tags $IMAGE_PREFIX/options-trader

        docker build -t $IMAGE_PREFIX/futures-trader:$TAG -t $IMAGE_PREFIX/futures-trader:latest --build-arg RUNNER_SCRIPT=futures_trading/futures_runner.py .
        docker push --all-tags $IMAGE_PREFIX/futures-trader

        docker build -t $IMAGE_PREFIX/cognitive-engine:$TAG -t $IMAGE_PREFIX/cognitive-engine:latest --build-arg RUNNER_SCRIPT=runner/cognitive_system.py .
        docker push --all-tags $IMAGE_PREFIX/cognitive-engine

        docker build -t $IMAGE_PREFIX/thought-journal:$TAG -t $IMAGE_PREFIX/thought-journal:latest --build-arg RUNNER_SCRIPT=runner/thought_journal.py .
        docker push --all-tags $IMAGE_PREFIX/thought-journal

        docker build -t $IMAGE_PREFIX/memory-manager:$TAG -t $IMAGE_PREFIX/memory-manager:latest --build-arg RUNNER_SCRIPT=runner/cognitive_memory.py .
        docker push --all-tags $IMAGE_PREFIX/memory-manager

  deploy-to-gke:
    name: Deploy to GKE with Helm
    runs-on: ubuntu-latest
    needs: build-and-push-images
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Authenticate to Google Cloud
      uses: 'google-github-actions/auth@v1'
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: Set up Cloud SDK
      uses: 'google-github-actions/setup-gcloud@v1'
      with:
        install_components: 'gke-gcloud-auth-plugin'

    - name: Configure kubectl
      env:
        GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        GKE_CLUSTER: ${{ secrets.GKE_CLUSTER }}
        GKE_ZONE: ${{ secrets.GKE_ZONE }}
      run: |
        gcloud container clusters get-credentials "${GKE_CLUSTER}" --zone "${GKE_ZONE}" --project "${GCP_PROJECT_ID}"

    - name: Set up Helm
      uses: azure/setup-helm@v3
      with:
        version: 'v3.12.0'

    - name: Create or Update Secrets
      run: |
        kubectl create namespace gpt --dry-run=client -o yaml | kubectl apply -f -
        kubectl create secret generic openai-api-key-secret --from-literal=api_key='${{ secrets.OPENAI_API_KEY }}' -n gpt --dry-run=client -o yaml | kubectl apply -f -
        kubectl create secret generic fastapi-api-key-secret --from-literal=api_key_hash='${{ secrets.API_KEY_HASH }}' -n gpt --dry-run=client -o yaml | kubectl apply -f -
        echo '${{ secrets.GCP_SA_KEY }}' | base64 -d > /tmp/gcp-sa-key.json
        kubectl create secret generic gcp-service-account-key --from-file=key.json=/tmp/gcp-sa-key.json -n gpt --dry-run=client -o yaml | kubectl apply -f -
        rm /tmp/gcp-sa-key.json
        echo "Namespace and secrets are configured."

    - name: Fix Helm Ownership for Existing Resources
      run: |
        echo "Fixing ownership of existing Kubernetes resources..."
        
        # Function to add Helm ownership to existing resources
        fix_resource_ownership() {
          local resource_type=$1
          local resource_name=$2
          local namespace=$3
          
          if kubectl get $resource_type $resource_name -n $namespace >/dev/null 2>&1; then
            echo "Adding Helm ownership to $resource_type/$resource_name"
            kubectl label $resource_type $resource_name -n $namespace app.kubernetes.io/managed-by=Helm --overwrite
            kubectl annotate $resource_type $resource_name -n $namespace meta.helm.sh/release-name=tron-system --overwrite
            kubectl annotate $resource_type $resource_name -n $namespace meta.helm.sh/release-namespace=gpt --overwrite
          fi
        }
        
        # Get all existing resources that might conflict
        echo "Checking for existing resources..."
        
        # Fix ServiceAccounts
        for sa in $(kubectl get serviceaccount -n gpt -o jsonpath='{.items[*].metadata.name}' 2>/dev/null || echo ""); do
          if [[ "$sa" == *"-sa" ]]; then
            fix_resource_ownership serviceaccount "$sa" gpt
          fi
        done
        
        # Fix other common resources that might conflict
        resource_types=("deployment" "service" "configmap" "secret" "ingress" "pvc")
        for resource_type in "${resource_types[@]}"; do
          for resource in $(kubectl get $resource_type -n gpt -o jsonpath='{.items[*].metadata.name}' 2>/dev/null || echo ""); do
            # Skip secrets we create in this workflow
            if [[ "$resource_type" == "secret" && ("$resource" == "openai-api-key-secret" || "$resource" == "fastapi-api-key-secret") ]]; then
              continue
            fi
            fix_resource_ownership "$resource_type" "$resource" gpt
          done
        done
        
        echo "Ownership fix completed."

    - name: Deploy with Helm
      id: deploy
      run: |
        helm dependency update ./helm
        
        # Try to deploy, with retry logic for common issues
        max_attempts=3
        attempt=1
        
        while [ $attempt -le $max_attempts ]; do
          echo "Deployment attempt $attempt of $max_attempts"
          
          if helm upgrade --install tron-system ./helm \
            --namespace gpt \
            --create-namespace \
            --cleanup-on-fail \
            --timeout 15m \
            --set-string global.imageTag=${{ github.sha }}; then
            echo "Deployment successful!"
            break
          else
            echo "Deployment attempt $attempt failed"
            
            if [ $attempt -eq $max_attempts ]; then
              echo "All deployment attempts failed"
              exit 1
            fi
            
            echo "Waiting 30 seconds before retry..."
            sleep 30
            attempt=$((attempt + 1))
          fi
        done
    
    - name: Verify deployment
      if: always() # Always run verification to see the state of the pods
      run: |
        echo "Verifying deployment status..."
        echo "Waiting for 60 seconds for pods to initialize before checking logs..."
        sleep 60
        
        echo "Helm release status:"
        helm status tron-system -n gpt

        echo "Pod status:"
        kubectl get pods -n gpt -o wide

        echo "Describing pods to check for errors:"
        kubectl describe pods -n gpt

        echo "Fetching logs from all pods:"
        for pod in $(kubectl get pods -n gpt -o jsonpath='{.items[*].metadata.name}'); do
          echo "--- Logs for $pod ---"
          kubectl logs "$pod" -n gpt --tail=100 || echo "Could not retrieve logs for $pod."
        done
        
        echo "Deployment verification completed." 