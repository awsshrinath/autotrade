name: Build and Deploy TRON Docker Stack

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deployment (skip cache)'
        required: false
        default: 'false'

env:
  REGISTRY: asia-south1-docker.pkg.dev
  PROJECT_ID: autotrade-453303
  REPOSITORY: tron-system

jobs:
  build-and-test:
    name: Build and Test Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies for testing
      run: |
        python -m pip install --upgrade pip
        pip install pytest flake8 bandit
        pip install -r requirements.txt

    - name: Run linting
      run: |
        flake8 . --config=.flake8

    - name: Run security scan
      run: |
        bandit -r . -c tools/security/bandit.yaml

    - name: Run tests
      run: |
        pytest tests/ -v --tb=short

    - name: Authenticate to Google Cloud
      uses: 'google-github-actions/auth@v2'
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: Set up Cloud SDK
      uses: 'google-github-actions/setup-gcloud@v2'

    - name: Configure Docker for GCR
      run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

    - name: Build and push Docker images
      run: |
        TAG=${{ github.sha }}
        SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
        IMAGE_PREFIX="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}"

        # Build and push main trading runner
        docker build \
          --build-arg RUNNER_SCRIPT=runner/main_runner.py \
          -t $IMAGE_PREFIX/main-runner:$TAG \
          -t $IMAGE_PREFIX/main-runner:$SHORT_SHA \
          -t $IMAGE_PREFIX/main-runner:latest \
          .
        docker push --all-tags $IMAGE_PREFIX/main-runner

        # Build and push stock trader
        docker build \
          --build-arg RUNNER_SCRIPT=stock_trading/stock_runner.py \
          -t $IMAGE_PREFIX/stock-trader:$TAG \
          -t $IMAGE_PREFIX/stock-trader:$SHORT_SHA \
          -t $IMAGE_PREFIX/stock-trader:latest \
          .
        docker push --all-tags $IMAGE_PREFIX/stock-trader

        # Build and push options trader
        docker build \
          --build-arg RUNNER_SCRIPT=options_trading/options_runner.py \
          -t $IMAGE_PREFIX/options-trader:$TAG \
          -t $IMAGE_PREFIX/options-trader:$SHORT_SHA \
          -t $IMAGE_PREFIX/options-trader:latest \
          .
        docker push --all-tags $IMAGE_PREFIX/options-trader

        # Build and push futures trader
        docker build \
          --build-arg RUNNER_SCRIPT=futures_trading/futures_runner.py \
          -t $IMAGE_PREFIX/futures-trader:$TAG \
          -t $IMAGE_PREFIX/futures-trader:$SHORT_SHA \
          -t $IMAGE_PREFIX/futures-trader:latest \
          .
        docker push --all-tags $IMAGE_PREFIX/futures-trader

        # Build and push dashboard API
        docker build \
          -f dashboard_api/Dockerfile \
          -t $IMAGE_PREFIX/dashboard-api:$TAG \
          -t $IMAGE_PREFIX/dashboard-api:$SHORT_SHA \
          -t $IMAGE_PREFIX/dashboard-api:latest \
          .
        docker push --all-tags $IMAGE_PREFIX/dashboard-api

        # Build and push frontend
        docker build \
          -f frontend/Dockerfile \
          -t $IMAGE_PREFIX/frontend:$TAG \
          -t $IMAGE_PREFIX/frontend:$SHORT_SHA \
          -t $IMAGE_PREFIX/frontend:latest \
          ./frontend
        docker push --all-tags $IMAGE_PREFIX/frontend

        # Build and push log aggregator
        docker build \
          -f gpt_runner/log_aggregator/Dockerfile \
          -t $IMAGE_PREFIX/log-aggregator:$TAG \
          -t $IMAGE_PREFIX/log-aggregator:$SHORT_SHA \
          -t $IMAGE_PREFIX/log-aggregator:latest \
          .
        docker push --all-tags $IMAGE_PREFIX/log-aggregator

  deploy-to-server:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Create deployment package
      run: |
        mkdir -p deployment-package
        cp docker-compose.yml deployment-package/
        cp .env.docker deployment-package/
        cp nginx.conf deployment-package/
        cp docker-healthcheck.sh deployment-package/
        cp -r config deployment-package/
        
        # Create deploy script
        cat > deployment-package/deploy.sh << 'EOF'
        #!/bin/bash
        set -e
        
        echo "🚀 Starting TRON Docker deployment..."
        
        # Backup existing deployment if it exists
        if [ -f docker-compose.yml ]; then
            echo "📦 Backing up existing deployment..."
            mkdir -p backups/$(date +%Y%m%d_%H%M%S)
            cp docker-compose.yml backups/$(date +%Y%m%d_%H%M%S)/
            cp .env.docker backups/$(date +%Y%m%d_%H%M%S)/ 2>/dev/null || true
        fi
        
        # Stop existing services
        echo "🛑 Stopping existing services..."
        docker-compose down --remove-orphans || true
        
        # Pull latest images
        echo "📥 Pulling latest images..."
        docker-compose pull
        
        # Create necessary directories
        echo "📁 Creating directories..."
        mkdir -p logs data
        
        # Start services
        echo "🏃 Starting services..."
        docker-compose up -d
        
        # Wait for services to be healthy
        echo "🏥 Waiting for health checks..."
        sleep 60
        
        # Check service status
        echo "📊 Service status:"
        docker-compose ps
        
        echo "✅ Deployment completed!"
        echo "🌐 Frontend: http://localhost:3000"
        echo "🔧 Dashboard API: http://localhost:8090"
        echo "📈 Trading Services: http://localhost:8080-8083"
        EOF
        
        chmod +x deployment-package/deploy.sh

    - name: Create deployment artifact
      uses: actions/upload-artifact@v4
      with:
        name: tron-deployment-${{ github.sha }}
        path: deployment-package/
        retention-days: 30

    - name: Create deployment instructions
      run: |
        cat > DEPLOYMENT_INSTRUCTIONS.md << 'EOF'
        # TRON Docker Deployment Instructions
        
        ## Quick Start
        
        1. Download the deployment artifact from the GitHub Actions run
        2. Extract the files to your server
        3. Ensure Docker and Docker Compose are installed
        4. Place your `gpt-runner-sa-key.json` in the deployment directory
        5. Run the deployment script:
           ```bash
           chmod +x deploy.sh
           ./deploy.sh
           ```
        
        ## Manual Deployment
        
        1. Copy files to your server:
           - docker-compose.yml
           - .env.docker
           - nginx.conf
           - docker-healthcheck.sh
           - config/ directory
        
        2. Create required directories:
           ```bash
           mkdir -p logs data
           ```
        
        3. Place your GCP service account key:
           ```bash
           cp path/to/your/gpt-runner-sa-key.json ./
           ```
        
        4. Start the services:
           ```bash
           docker-compose up -d
           ```
        
        ## Service URLs
        
        - Frontend Dashboard: http://localhost:3000
        - Dashboard API: http://localhost:8090
        - Main Runner: http://localhost:8080
        - Stock Trader: http://localhost:8081
        - Options Trader: http://localhost:8082
        - Futures Trader: http://localhost:8083
        - Log Aggregator: http://localhost:8095
        
        ## Health Checks
        
        Check service health:
        ```bash
        docker-compose ps
        curl http://localhost:8080/health
        ```
        
        ## Logs
        
        View logs:
        ```bash
        docker-compose logs -f [service-name]
        ```
        
        ## Troubleshooting
        
        1. Check container status: `docker-compose ps`
        2. View logs: `docker-compose logs`
        3. Restart services: `docker-compose restart`
        4. Check disk space: `df -h`
        5. Check memory usage: `free -h`
        
        EOF

    - name: Upload deployment instructions
      uses: actions/upload-artifact@v4
      with:
        name: deployment-instructions
        path: DEPLOYMENT_INSTRUCTIONS.md

  # Optional: Deploy to staging server if configured
  deploy-to-staging:
    name: Deploy to Staging Server
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && false  # Disabled by default
    
    steps:
    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.STAGING_HOST }}
        username: ${{ secrets.STAGING_USERNAME }}
        key: ${{ secrets.STAGING_SSH_KEY }}
        script: |
          cd /opt/tron
          git pull origin main
          docker-compose pull
          docker-compose up -d --remove-orphans
          docker system prune -f