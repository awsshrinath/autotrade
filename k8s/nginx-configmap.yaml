apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-proxy-config
  namespace: default # Assuming 'default', adjust if your namespace is different
data:
  nginx.conf: |
    server {
        listen 80;
        server_name _;

        # Frontend files
        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # API Gateway to backend
        location /api/ {
            # The service name 'tron-backend-service' must match the backend service name.
            proxy_pass http://tron-backend:8000/; # Assuming backend service is named 'tron-backend' on port 8000
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }
        
        # Static assets for Next.js
        location /_next/static {
            alias /usr/share/nginx/html/.next/static;
            expires 1y;
            access_log off;
            add_header Cache-Control "public";
        }

        # Error pages
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    } 