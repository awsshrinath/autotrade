apiVersion: apps/v1
kind: Deployment
metadata:
  name: cognitive-system
  labels:
    app: cognitive-system
spec:
  replicas: 0 # Scales to 1 during market hours
  selector:
    matchLabels:
      app: cognitive-system
  template:
    metadata:
      labels:
        app: cognitive-system
    spec:
      containers:
      - name: cognitive-system
        image: asia-south1-docker.pkg.dev/autotrade-453303/tron-system/cognitive-engine:latest
        ports:
        - containerPort: 8085
        resources:
          requests:
            cpu: "1"
            memory: "3Gi"
          limits:
            cpu: "1.5"
            memory: "4Gi"
        readinessProbe:
          httpGet:
            path: /health
            port: 8085
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8085
          initialDelaySeconds: 15
          periodSeconds: 20 