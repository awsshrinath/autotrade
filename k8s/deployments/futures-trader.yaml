apiVersion: apps/v1
kind: Deployment
metadata:
  name: futures-trader
  labels:
    app: futures-trader
spec:
  replicas: 0 # Scales to 1 during market hours
  selector:
    matchLabels:
      app: futures-trader
  template:
    metadata:
      labels:
        app: futures-trader
    spec:
      containers:
      - name: futures-trader
        image: asia-south1-docker.pkg.dev/autotrade-453303/tron-system/futures-trader:latest
        ports:
        - containerPort: 8083
        resources:
          requests:
            cpu: "1"
            memory: "2Gi"
          limits:
            cpu: "1.5"
            memory: "3Gi"
        readinessProbe:
          httpGet:
            path: /health
            port: 8083
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8083
          initialDelaySeconds: 15
          periodSeconds: 20 