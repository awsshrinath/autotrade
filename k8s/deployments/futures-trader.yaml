apiVersion: apps/v1
kind: Deployment
metadata:
  name: futures-trader
  namespace: gpt
  labels:
    app: futures-trader
spec:
  replicas: 0 # Scaled up by CronJob during market hours
  selector:
    matchLabels:
      app: futures-trader
  template:
    metadata:
      labels:
        app: futures-trader
    spec:
      containers:
      - name: futures-trader
        image: asia-south1-docker.pkg.dev/autotrade-453303/tron-system/futures-trader:latest
        ports:
        - containerPort: 8083
        resources:
          requests:
            cpu: "200m"
            memory: "400Mi"
          limits:
            cpu: "0.5"
            memory: "1Gi"
        command: ["python", "-u", "futures_trading/futures_runner.py"]
        readinessProbe:
          httpGet:
            path: /health
            port: 8083
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8083
          initialDelaySeconds: 15
          periodSeconds: 20 