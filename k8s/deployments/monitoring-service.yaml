apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitoring-service
  namespace: gpt
  labels:
    app: monitoring-service
spec:
  replicas: 0 # Scales to 1 during market hours
  selector:
    matchLabels:
      app: monitoring-service
  template:
    metadata:
      labels:
        app: monitoring-service
    spec:
      containers:
      - name: monitoring-service
        image: asia-south1-docker.pkg.dev/autotrade-453303/tron-system/gpt-runner:latest
        ports:
        - containerPort: 8085
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "250m"
            memory: "512Mi"
        command: ["python", "-u", "runner/monitoring_runner.py"]
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 15
          periodSeconds: 20 