apiVersion: apps/v1
kind: Deployment
metadata:
  name: main-runner
  namespace: gpt
  labels:
    app: main-runner
spec:
  replicas: 0 # Scales to 1 during market hours
  selector:
    matchLabels:
      app: main-runner
  template:
    metadata:
      labels:
        app: main-runner
    spec:
      containers:
      - name: main-runner
        image: asia-south1-docker.pkg.dev/autotrade-453303/tron-system/gpt-runner:latest
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "0.5"
            memory: "1Gi"
          limits:
            cpu: "1"
            memory: "2Gi"
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
        command: ["python", "-u", "runner/main_runner.py"] 