apiVersion: apps/v1
kind: Deployment
metadata:
  name: options-trader
  namespace: gpt
  labels:
    app: options-trader
spec:
  replicas: 0 # Scaled up by CronJob during market hours
  selector:
    matchLabels:
      app: options-trader
  template:
    metadata:
      labels:
        app: options-trader
    spec:
      containers:
      - name: options-trader
        image: asia-south1-docker.pkg.dev/autotrade-453303/tron-system/options-trader:latest
        ports:
        - containerPort: 8082
        resources:
          requests:
            cpu: "200m"
            memory: "400Mi"
          limits:
            cpu: "0.5"
            memory: "1Gi"
        command: ["python", "-u", "options_trading/options_runner.py"]
        readinessProbe:
          httpGet:
            path: /health
            port: 8082
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8082
          initialDelaySeconds: 15
          periodSeconds: 20 