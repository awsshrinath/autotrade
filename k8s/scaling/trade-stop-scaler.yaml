apiVersion: batch/v1
kind: CronJob
metadata:
  name: trade-stop-scaler
  namespace: gpt
spec:
  schedule: "35 15 * * 1-5" # 3:35 PM IST, Mon-Fri
  timeZone: "Asia/Kolkata"
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: cronjob-scaler
          containers:
          - name: kubectl-scaler
            image: bitnami/kubectl:latest
            resources:
              requests:
                cpu: "50m"
                memory: "64Mi"
              limits:
                cpu: "100m"
                memory: "128Mi"
            command:
            - "/bin/sh"
            - "-c"
            - |
              echo "Scaling down trading pods for market close..."
              kubectl scale deployment stock-trader --replicas=0
              kubectl scale deployment options-trader --replicas=0
              kubectl scale deployment futures-trader --replicas=0
              echo "Trading pod scaling down complete."
          restartPolicy: OnFailure
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1 