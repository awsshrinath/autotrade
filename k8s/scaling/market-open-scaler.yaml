apiVersion: batch/v1
kind: CronJob
metadata:
  name: market-open-scaler
  namespace: gpt
spec:
  schedule: "0 8 * * 1-5" # 8:00 AM IST, Mon-Fri
  timeZone: "Asia/Kolkata"
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: cronjob-scaler
          containers:
          - name: kubectl-scaler
            image: bitnami/kubectl:latest
            command:
            - "/bin/sh"
            - "-c"
            - |
              echo "Scaling up all services for market open..."
              kubectl scale deployment nginx-proxy --replicas=1
              kubectl scale deployment tron-backend --replicas=1
              kubectl scale deployment main-runner --replicas=1
              kubectl scale deployment frontend --replicas=1
              kubectl scale deployment monitoring-service --replicas=1
              kubectl scale deployment stock-trader --replicas=1
              kubectl scale deployment options-trader --replicas=1
              kubectl scale deployment futures-trader --replicas=1
              kubectl scale deployment cognitive-system --replicas=1
              echo "Market open scaling complete."
          restartPolicy: OnFailure
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1 