apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.mainRunner.name }}
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.mainRunner.replicaCount | default .Values.replicaCount }}
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app: {{ .Values.mainRunner.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.mainRunner.name }}
    spec:
      serviceAccountName: {{ .Values.serviceAccountName }}
      containers:
        - name: {{ .Values.mainRunner.name }}
          image: "{{ .Values.mainRunner.image.repository }}:{{ .Values.global.imageTag | default .Values.mainRunner.image.tag }}"
          command: ["/bin/bash", "/entrypoint.sh"]
          resources:
            {{- toYaml .Values.mainRunner.resources | nindent 12 }}
          env:
            - name: GCP_PROJECT_ID
              valueFrom:
                configMapKeyRef:
                  name: tron-system-config
                  key: GCP_PROJECT_ID
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: tron-system-config
                  key: ENVIRONMENT
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: tron-system-config
                  key: LOG_LEVEL
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: openai-api-key
                  optional: true
            - name: KITE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: kite-api-key
                  optional: true
            - name: KITE_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: kite-api-secret
                  optional: true
            {{- range $key, $val := .Values.mainRunner.env }}
            - name: {{ $key }}
              value: "{{ $val }}"
            {{- end }}
            - name: PYTHONPATH
              value: "/app:/app/runner"
            - name: HEALTH_CHECK_ENABLED
              value: "{{ .Values.mainRunner.healthCheck.enabled }}"
            - name: SERVICE_PORT
              value: "{{ .Values.mainRunner.service.targetPort }}"
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: "/etc/gcp/key.json"
            - name: FIRESTORE_PROJECT_ID
              valueFrom:
                configMapKeyRef:
                  name: tron-system-config
                  key: GCP_PROJECT_ID
            - name: GOOGLE_CLOUD_PROJECT
              valueFrom:
                configMapKeyRef:
                  name: tron-system-config
                  key: GCP_PROJECT_ID
          volumeMounts:
            - name: entrypoint
              mountPath: /entrypoint.sh
              subPath: entrypoint.sh
            - name: gcp-service-account-key
              mountPath: /etc/gcp
              readOnly: true
          ports:
            - containerPort: {{ .Values.mainRunner.service.targetPort }}
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.mainRunner.service.targetPort }}
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.mainRunner.service.targetPort }}
            initialDelaySeconds: 180
            periodSeconds: 60
            timeoutSeconds: 15
            failureThreshold: 5
      volumes:
        - name: entrypoint
          configMap:
            name: entrypoint-config
            defaultMode: 0755
        - name: gcp-service-account-key
          secret:
            secretName: gcp-service-account-key
            optional: true 