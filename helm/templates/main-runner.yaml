apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.mainRunner.name }}
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.mainRunner.replicaCount | default .Values.replicaCount }}
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app: {{ .Values.mainRunner.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.mainRunner.name }}
    spec:
      serviceAccountName: {{ .Values.serviceAccountName }}
      containers:
        - name: {{ .Values.mainRunner.name }}
          image: "{{ .Values.mainRunner.image.repository }}:{{ .Values.global.imageTag | default .Values.mainRunner.image.tag }}"
          command: ["/bin/bash", "/entrypoint.sh"]
          args: ["runner/main_runner.py"]
          resources:
            {{- toYaml .Values.mainRunner.resources | nindent 12 }}
          env:
            - name: GCP_PROJECT_ID
              valueFrom:
                configMapKeyRef:
                  name: tron-system-config
                  key: GCP_PROJECT_ID
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: tron-system-config
                  key: ENVIRONMENT
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: tron-system-config
                  key: LOG_LEVEL
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: openai-api-key
                  optional: true
            - name: KITE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: kite-api-key
                  optional: true
            - name: KITE_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: kite-api-secret
                  optional: true
            {{- range $key, $val := .Values.mainRunner.env }}
            {{- if ne $key "RUNNER_SCRIPT" }}
            - name: {{ $key }}
              value: "{{ $val }}"
            {{- end }}
            {{- end }}
            - name: PYTHONPATH
              value: "/app:/app/runner"
          volumeMounts:
            - name: entrypoint
              mountPath: /entrypoint.sh
              subPath: entrypoint.sh
          ports:
            - containerPort: {{ .Values.mainRunner.service.targetPort }}
              name: http
          readinessProbe:
            exec:
              command:
                - pgrep
                - -f
                - "runner/main_runner.py"
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - pgrep
                - -f
                - "runner/main_runner.py"
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
      volumes:
        - name: entrypoint
          configMap:
            name: entrypoint-config
            defaultMode: 0755 