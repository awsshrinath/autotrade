apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.stockTrader.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.stockTrader.name }}
    app.kubernetes.io/component: trading-engine
    app.kubernetes.io/part-of: tron-trading-system
spec:
  replicas: {{ .Values.stockTrader.replicaCount | default .Values.replicaCount }}
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app: {{ .Values.stockTrader.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.stockTrader.name }}
    spec:
      serviceAccountName: {{ .Values.serviceAccountName }}
      containers:
        - name: {{ .Values.stockTrader.name }}
          image: "{{ .Values.stockTrader.image.repository }}:{{ .Values.global.imageTag | default .Values.stockTrader.image.tag }}"
          command: ["/bin/bash", "/entrypoint.sh"]
          args: ["{{ .Values.stockTrader.env.RUNNER_SCRIPT }}"]
          ports:
            - containerPort: {{ .Values.stockTrader.service.targetPort }}
              name: http
          resources:
            {{- toYaml .Values.stockTrader.resources | nindent 12 }}
          env:
            - name: GCP_PROJECT_ID
              valueFrom:
                configMapKeyRef:
                  name: tron-system-config
                  key: GCP_PROJECT_ID
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: tron-system-config
                  key: ENVIRONMENT
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: tron-system-config
                  key: LOG_LEVEL
            {{- if not .Values.stockTrader.env.MAIN_RUNNER_SERVICE }}
            - name: MAIN_RUNNER_SERVICE
              value: "main-runner-service.{{ .Values.namespace }}.svc.cluster.local:8080"
            {{- end }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: openai-api-key
                  optional: true
            - name: KITE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: kite-api-key
                  optional: true
            - name: KITE_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: kite-api-secret
                  optional: true
            {{- range $key, $val := .Values.stockTrader.env }}
            - name: {{ $key }}
              value: "{{ $val }}"
            {{- end }}
            - name: PYTHONPATH
              value: "/app:/app/runner:/app/stock_trading"
            - name: HEALTH_CHECK_ENABLED
              value: "{{ .Values.stockTrader.healthCheck.enabled }}"
            - name: SERVICE_PORT
              value: "{{ .Values.stockTrader.service.targetPort }}"
          startupProbe:
            httpGet:
              path: /health
              port: {{ .Values.stockTrader.service.targetPort }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.stockTrader.service.targetPort }}
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.stockTrader.service.targetPort }}
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: entrypoint
              mountPath: /entrypoint.sh
              subPath: entrypoint.sh
            - name: gcp-service-account-key
              mountPath: /etc/gcp
              readOnly: true
      volumes:
        - name: entrypoint
          configMap:
            name: entrypoint-config
            defaultMode: 0755
        - name: gcp-service-account-key
          secret:
            secretName: gcp-service-account-key