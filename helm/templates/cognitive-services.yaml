# TRON Trading System - Cognitive Services
# Cognitive Engine, Thought Journal, and Memory Manager deployments

---
# Cognitive Engine Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.cognitiveEngine.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.cognitiveEngine.name }}
    app.kubernetes.io/component: cognitive-system
    app.kubernetes.io/part-of: tron-trading-system
spec:
  replicas: {{ .Values.cognitiveEngine.replicaCount | default .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.cognitiveEngine.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.cognitiveEngine.name }}
    spec:
      serviceAccountName: {{ .Values.serviceAccountName }}
      containers:
        - name: {{ .Values.cognitiveEngine.name }}
          image: "{{ .Values.cognitiveEngine.image.repository }}:{{ .Values.global.imageTag | default .Values.cognitiveEngine.image.tag }}"
          imagePullPolicy: {{ .Values.cognitiveEngine.image.pullPolicy }}
          command: ["/bin/bash", "/app/entrypoint.sh"]
          args: ["runner/cognitive_system.py"]
          ports:
            - containerPort: {{ .Values.cognitiveEngine.service.targetPort }}
              name: http
          env:
            - name: GCP_PROJECT_ID
              valueFrom:
                configMapKeyRef:
                  name: tron-system-config
                  key: GCP_PROJECT_ID
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: tron-system-config
                  key: ENVIRONMENT
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: tron-system-config
                  key: LOG_LEVEL
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: openai-api-key
                  optional: true
            {{- range $key, $val := .Values.cognitiveEngine.env }}
            - name: {{ $key }}
              value: "{{ $val }}"
            {{- end }}
            - name: PYTHONPATH
              value: "/app:/app/runner"
          resources:
            {{- toYaml .Values.cognitiveEngine.resources | nindent 12 }}
          {{- if .Values.cognitiveEngine.healthCheck.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.cognitiveEngine.healthCheck.path }}
              port: {{ .Values.cognitiveEngine.healthCheck.port }}
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: {{ .Values.cognitiveEngine.healthCheck.path }}
              port: {{ .Values.cognitiveEngine.healthCheck.port }}
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          {{- end }}
          volumeMounts:
            - name: entrypoint
              mountPath: /app/entrypoint.sh
              subPath: entrypoint.sh
      volumes:
        - name: entrypoint
          configMap:
            name: entrypoint-config
            defaultMode: 0755
      restartPolicy: Always

---
# Cognitive Engine Service
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.cognitiveEngine.name }}
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: {{ .Values.cognitiveEngine.name }}
  ports:
    - protocol: TCP
      port: {{ .Values.cognitiveEngine.service.port }}
      targetPort: {{ .Values.cognitiveEngine.service.targetPort }}
  type: {{ .Values.cognitiveEngine.service.type | default "ClusterIP" }}

