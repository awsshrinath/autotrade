apiVersion: v1
kind: Service
metadata:
  name: tron-app-loadbalancer
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: tron-app
    app.kubernetes.io/component: loadbalancer
    app.kubernetes.io/part-of: tron-trading-system
spec:
  selector:
    app: nginx-proxy
  ports:
  - port: 80
    targetPort: 80
    name: http
  type: ClusterIP
  # For private IP access only - use kubectl port-forward or internal cluster access