apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.optionsTrader.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.optionsTrader.name }}
    app.kubernetes.io/component: trading-engine
    app.kubernetes.io/part-of: tron-trading-system
spec:
  replicas: {{ .Values.optionsTrader.replicaCount | default .Values.replicaCount }}
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app: {{ .Values.optionsTrader.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.optionsTrader.name }}
    spec:
      serviceAccountName: {{ .Values.serviceAccountName }}
      containers:
        - name: {{ .Values.optionsTrader.name }}
          image: "{{ .Values.optionsTrader.image.repository }}:{{ .Values.global.imageTag | default .Values.optionsTrader.image.tag }}"
          command: ["/bin/bash", "/entrypoint.sh"]
          args: ["{{ .Values.optionsTrader.env.RUNNER_SCRIPT }}"]
          ports:
            - containerPort: {{ .Values.optionsTrader.service.targetPort }}
              name: http
          resources:
            {{- toYaml .Values.optionsTrader.resources | nindent 12 }}
          env:
            - name: GCP_PROJECT_ID
              valueFrom:
                configMapKeyRef:
                  name: tron-system-config
                  key: GCP_PROJECT_ID
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: tron-system-config
                  key: ENVIRONMENT
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: tron-system-config
                  key: LOG_LEVEL
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: openai-api-key
                  optional: true
            - name: KITE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: kite-api-key
                  optional: true
            - name: KITE_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: kite-api-secret
                  optional: true
            {{- if not .Values.optionsTrader.env.MAIN_RUNNER_SERVICE }}
            - name: MAIN_RUNNER_SERVICE
              value: "main-runner-service.{{ .Values.namespace }}.svc.cluster.local:8080"
            {{- end }}
            {{- range $key, $val := .Values.optionsTrader.env }}
            - name: {{ $key }}
              value: "{{ $val }}"
            {{- end }}
            - name: PYTHONPATH
              value: "/app:/app/runner:/app/options_trading"
          readinessProbe:
            exec:
              command:
                - pgrep
                - -f
                - "{{ .Values.optionsTrader.env.RUNNER_SCRIPT }}"
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - pgrep
                - -f
                - "{{ .Values.optionsTrader.env.RUNNER_SCRIPT }}"
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: entrypoint
              mountPath: /entrypoint.sh
              subPath: entrypoint.sh
      volumes:
        - name: entrypoint
          configMap:
            name: entrypoint-config
            defaultMode: 0755