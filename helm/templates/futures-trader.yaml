apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.futuresTrader.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.futuresTrader.name }}
    app.kubernetes.io/component: trading-engine
    app.kubernetes.io/part-of: tron-trading-system
spec:
  replicas: {{ .Values.futuresTrader.replicaCount | default .Values.replicaCount }}
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app: {{ .Values.futuresTrader.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.futuresTrader.name }}
    spec:
      serviceAccountName: {{ .Values.serviceAccountName }}
      containers:
        - name: {{ .Values.futuresTrader.name }}
          image: "{{ .Values.futuresTrader.image.repository }}:{{ .Values.global.imageTag | default .Values.futuresTrader.image.tag }}"
          command: ["/bin/bash", "/entrypoint.sh"]
          args: ["{{ .Values.futuresTrader.env.RUNNER_SCRIPT }}"]
          ports:
            - containerPort: {{ .Values.futuresTrader.service.targetPort }}
              name: http
          resources:
            {{- toYaml .Values.futuresTrader.resources | nindent 12 }}
          env:
            - name: GCP_PROJECT_ID
              valueFrom:
                configMapKeyRef:
                  name: tron-system-config
                  key: GCP_PROJECT_ID
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: tron-system-config
                  key: ENVIRONMENT
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: tron-system-config
                  key: LOG_LEVEL
            - name: kite-api-secret
              valueFrom:
                configMapKeyRef:
                  name: tron-system-config
                  key: kite-api-secret
                  optional: true
            {{- if not .Values.futuresTrader.env.MAIN_RUNNER_SERVICE }}
            - name: MAIN_RUNNER_SERVICE
              value: "main-runner-service.{{ .Values.namespace }}.svc.cluster.local:8080"
            {{- end }}
            {{- range $key, $val := .Values.futuresTrader.env }}
            - name: {{ $key }}
              value: "{{ $val }}"
            {{- end }}
            - name: PYTHONPATH
              value: "/app:/app/runner"
          volumeMounts:
            - name: entrypoint
              mountPath: /entrypoint.sh
              subPath: entrypoint.sh
      volumes:
        - name: entrypoint
          configMap:
            name: entrypoint-config
            defaultMode: 0755