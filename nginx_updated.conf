server {
    listen 80;
    server_name _;

    # Proxy frontend traffic to frontend service
    location / {
        proxy_pass http://frontend:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
    }

    # Static endpoints for missing system metrics
    location /api/v1/system/resources {
        add_header Content-Type application/json;
        alias /tmp/system_resources_static.json;
    }
    
    location /api/v1/system/memory {
        add_header Content-Type application/json;
        alias /tmp/system_memory_static.json;
    }
    
    location /api/v1/system/status {
        add_header Content-Type application/json;
        alias /tmp/system_status_static.json;
    }

    # Dashboard API Gateway (for all other API endpoints)
    location /api/ {
        proxy_pass http://dashboard-api:8001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
    
    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Error pages
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        return 500 'Server Error';
        add_header Content-Type text/plain;
    }
}